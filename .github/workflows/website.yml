name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pyyaml
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - run: npm run build
      - name: Check published files match sources
        run: |
          for file in index.html toolkit.css toolkit.js source.json .nojekyll; do
            diff "$file" "dist/$file"
          done
          for file in skills/*/index.html; do
            diff "$file" "dist/$file"
          done
